services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: simlab
      POSTGRES_USER: simlab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simlab"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:8.2.1-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://simlab:${POSTGRES_PASSWORD}@postgres:5432/simlab
      REDIS_URL: redis://redis:6379/0
      CHANNEL_REDIS_URL: redis://redis:6379/1
      EVENT_STREAM_REDIS_URL: redis://redis:6379/2
    command: ["uvicorn", "config.asgi:application", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports: ["8000:8000"]
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://simlab:${POSTGRES_PASSWORD}@postgres:5432/simlab
      REDIS_URL: redis://redis:6379/0
      CHANNEL_REDIS_URL: redis://redis:6379/1
      EVENT_STREAM_REDIS_URL: redis://redis:6379/2
    command: ["celery", "-A", "config", "worker", "-l", "INFO"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  outbox:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://simlab:${POSTGRES_PASSWORD}@postgres:5432/simlab
      EVENT_STREAM_REDIS_URL: redis://redis:6379/2
    command: ["python", "manage.py", "run_outbox_dispatcher"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  eventrelay:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://simlab:${POSTGRES_PASSWORD}@postgres:5432/simlab
      CHANNEL_REDIS_URL: redis://redis:6379/1
      EVENT_STREAM_REDIS_URL: redis://redis:6379/2
    command: ["python", "manage.py", "run_event_relay"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
volumes:
  postgres-data:
  redis-data:
